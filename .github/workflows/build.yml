name: iOS CI Build Workflow

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-swiftleeds:
    name: Build SwiftLeeds (DEBUG)
    runs-on: macos-26
    steps:
      - name: Checkout iOS Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Build SwiftLeeds via Fastlane
        run: fastlane build_swiftleeds

  build-kotlinleeds:
    name: Build KotlinLeeds (DEBUG)
    runs-on: macos-26
    steps:
      - name: Checkout iOS Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Build KotlinLeeds via Fastlane
        run: fastlane build_kotlinleeds

  test-packages:
    name: Test Swift Packages
    runs-on: macos-26
    steps:
      - name: Checkout iOS Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Run every package test suite
        run: |
          set -uo pipefail
          scratch="$PWD/.build-shared"
          count=0
          failed=()
          for dir in Packages/*/; do
            [ -f "${dir}Package.swift" ] || continue
            echo "::group::${dir%/}"
            (cd "$dir" && swift test --scratch-path "$scratch") || failed+=("${dir%/}")
            echo "::endgroup::"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "No Swift packages found under Packages/" >&2
            exit 1
          fi
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Failing packages: ${failed[*]}"
            exit 1
          fi
          echo "Tested $count package(s)"

  # Snapshot tests are the only tests that must run on iOS: they are the only
  # ones behind `#if os(iOS)`, so the macOS job above cannot see them. Every
  # other test compiles and runs there, and the app build jobs compile the
  # iOS-only sources, so nothing is covered twice and nothing is left out.
  #
  # A package opts in by declaring a test target whose name ends in
  # SnapshotTests, plus a shared scheme of the same name holding only that
  # target. The scheme is what keeps the build small: `-only-testing:` would
  # still compile the package's other test targets.
  test-snapshots-ios:
    name: Test Snapshots (iOS Simulator)
    runs-on: macos-26
    env:
      DESTINATION: 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5'
    steps:
      - name: Checkout iOS Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      # The runner carries three iOS runtimes, each with its own iPhone 17 Pro.
      # Without OS= xcodebuild picks one and never says which, so an image roll
      # could change the runtime silently, which would break every reference
      # image at once. Checking here turns a missing runtime into one legible
      # line instead of a confusing xcodebuild error.
      - name: Check the pinned simulator runtime is present
        run: |
          set -euo pipefail
          xcrun simctl list runtimes | grep 'iOS 26.5'

      - name: Run every snapshot test target on the simulator
        run: |
          set -uo pipefail
          count=0
          failed=""
          for dir in Packages/*/; do
            [ -f "${dir}Package.swift" ] || continue
            name=$(basename "$dir")
            targets=$( (cd "$dir" && swift package describe --type json) \
              | jq -r '.targets[] | select(.type == "test") | select(.name | endswith("SnapshotTests")) | .name' )
            [ -n "$targets" ] || continue
            for target in $targets; do
              echo "::group::$name / $target"
              # The scheme must exist and must hold only this target. Without it
              # xcodebuild builds every test target in the package, which is the
              # cost this job exists to avoid.
              (cd "$dir" && xcodebuild test -scheme "$target" -destination "$DESTINATION") \
                || failed="$failed $name/$target"
              echo "::endgroup::"
              count=$((count + 1))
            done
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::No *SnapshotTests target found under Packages/" >&2
            exit 1
          fi
          if [ -n "$failed" ]; then
            echo "::error::Failing snapshot targets:$failed"
            exit 1
          fi
          echo "Tested $count snapshot target(s) on the simulator"

  lint-swift:
    name: Lint Swift Sources
    runs-on: macos-26
    env:
      # The version itself lives in .swiftlint-version, which the pre-commit
      # hook reads too, so both halves judge code by the same rules. Bumping it
      # means updating this checksum as well, or the download check below fails.
      SWIFTLINT_SHA256: 'c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0'
    steps:
      - name: Checkout iOS Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Install SwiftLint
        run: |
          set -euo pipefail
          version=$(cat .swiftlint-version)
          cd "$RUNNER_TEMP"
          curl -sSL --retry 3 -o portable_swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${version}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  portable_swiftlint.zip" | shasum -a 256 -c -
          unzip -q portable_swiftlint.zip -d swiftlint
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Lint every Swift source
        run: |
          # --strict is what makes this a gate: SwiftLint exits 0 on a warning,
          # so without it the job passes while reporting violations.
          status=0
          swiftlint lint --strict --reporter github-actions-logging \
            > "$RUNNER_TEMP/lint.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/lint.log"
          # A misspelt rule name is only a warning and leaves the exit code at 0,
          # which would silently disable that rule for everyone.
          if grep -q "is not a valid rule identifier" "$RUNNER_TEMP/lint.log"; then
            echo "::error::.swiftlint.yml names a rule SwiftLint does not recognise"
            exit 1
          fi
          exit "$status"

      # The simulator job finds snapshot tests by target name. A snapshot test
      # written into any other target would compile, pass on macOS by doing
      # nothing, and never run on iOS again. This turns that into a failure.
      - name: Check snapshot tests live in a snapshot target
        run: |
          set -uo pipefail
          stray=$(grep -rl "assertSnapshots(" Packages/*/Tests \
            | grep -v "/Tests/[^/]*SnapshotTests/" || true)
          if [ -n "$stray" ]; then
            echo "::error::These call assertSnapshots but sit outside a *SnapshotTests target:"
            echo "$stray"
            exit 1
          fi
          echo "Every assertSnapshots call is in a snapshot target"

  # An Xcode project file is a property list, so a repeated object id is
  # undefined. The parser keeps one definition and drops the other without a
  # word. That is how the app target once lost a package product link and went
  # on building anyway, because a second product pulled the module in behind it.
  #
  # This reads a text file. It needs no Xcode, no simulator and no compiler, so
  # it runs on Linux: a macOS runner bills ten times the rate for the same two
  # seconds of work. The image is pinned for the same reason the macOS jobs pin
  # theirs, so an image roll cannot break every branch with no commit to blame.
  lint-project-files:
    name: Lint Xcode Project Files
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout iOS Repository
        uses: actions/checkout@v4

      - name: Check every object id is defined once
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          # An object definition sits at exactly two tabs. Everything inside one
          # sits deeper, so this matches definitions and nothing else. Checked
          # against the parser: on a clean file the count of matches equals the
          # count of keys plutil reports.
          definition = re.compile(r"^\t\t([0-9A-F]{24})[ =]")

          files = sorted(Path().glob("*.xcodeproj/project.pbxproj"))
          files += sorted(Path().glob("Packages/*/*.xcodeproj/project.pbxproj"))
          if not files:
              print("::error::Found no project.pbxproj to check")
              sys.exit(1)

          failed = False
          for path in files:
              counts = {}
              for line in path.read_text().splitlines():
                  match = definition.match(line)
                  if match:
                      counts[match.group(1)] = counts.get(match.group(1), 0) + 1

              # Zero matches means the format moved, not that the file is clean.
              if not counts:
                  print(f"::error::{path} yielded no object ids, so this check is broken")
                  failed = True
                  continue

              repeated = sorted(i for i, n in counts.items() if n > 1)
              if repeated:
                  print(f"::error::{path} defines these object ids more than once: {', '.join(repeated)}")
                  failed = True
                  continue

              print(f"{path}: {len(counts)} object ids, each defined once")

          sys.exit(1 if failed else 0)
          PY

name: iOS CI Build Workflow

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-swiftleeds:
    name: Build SwiftLeeds (DEBUG)
    runs-on: macos-26
    steps:
      - name: Checkout iOS Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Build SwiftLeeds via Fastlane
        run: fastlane build_swiftleeds

  build-kotlinleeds:
    name: Build KotlinLeeds (DEBUG)
    runs-on: macos-26
    steps:
      - name: Checkout iOS Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Build KotlinLeeds via Fastlane
        run: fastlane build_kotlinleeds

  test-packages:
    name: Test Swift Packages
    runs-on: macos-26
    steps:
      - name: Checkout iOS Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Run every package test suite
        env:
          # Packages tested at once. 2 lanes 238s against 3 lanes 285s, medians
          # of 5 paired runs; 1 lane was 311s, one sample. 3 loses because each
          # lane needs its own scratch path, so it recompiles the shared
          # dependencies, and one swift test already asks for all 3 cores.
          # Memory ruled out: both arms swapped 0 MB.
          LANE_COUNT: 2
        run: |
          set -uo pipefail
          # The runner the figures above were measured on.
          echo "cores: $(sysctl -n hw.ncpu), memory: $(sysctl -n hw.memsize) bytes"

          packages=()
          for dir in Packages/*/; do
            [ -f "${dir}Package.swift" ] || continue
            packages+=("$(basename "$dir")")
          done
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No Swift packages found under Packages/" >&2
            exit 1
          fi

          claims="$RUNNER_TEMP/package-test-claims"
          failures="$RUNNER_TEMP/package-test-failures"
          rm -rf "$claims" "$failures"
          mkdir -p "$claims"

          # SwiftPM file-locks its scratch path, so lanes sharing one would
          # queue instead of overlapping. Each lane gets its own, which repeats
          # 14% of the dependency compilation (241s in one path against 168s
          # plus 107s split across two, measured cold and sequentially).
          run_lane () {
            local lane=$1
            local scratch="$RUNNER_TEMP/build-lane-$lane"
            local package
            for package in "${packages[@]}"; do
              # mkdir is atomic and fails when the directory exists, so two
              # lanes never take the same package. A queue keeps them balanced:
              # a fixed 8/8 split ran 168s against 107s, the queue 182s and 190s.
              mkdir "$claims/$package" 2>/dev/null || continue
              # --force-resolved-versions uses each package's committed
              # Package.resolved instead of resolving again, which was 91s. A
              # file that cannot satisfy the manifest now fails the job instead
              # of quietly resolving something newer. It does not touch the
              # app's own Package.resolved; CLAUDE.md covers keeping those two
              # in step.
              #
              # Not folded into a ::group::, because GitHub timestamps each line
              # as it arrives and those timestamps are the only record of the
              # phase boundaries. `sed -l` flushes per line. A line over 512
              # bytes is not written atomically, so a long diagnostic can land
              # under the other lane's prefix.
              if swift test \
                --package-path "Packages/$package" \
                --scratch-path "$scratch" \
                --force-resolved-versions 2>&1 \
                | sed -l "s/^/[$package] /"
              then
                touch "$claims/$package/passed"
              else
                echo "$package" >> "$failures"
              fi
            done
          }

          .github/scripts/memory-pressure.sh start

          # A lane is a subshell, so a failure appended to a shell array would
          # be lost and the job would go green. Failures go to a file.
          for lane in $(seq 1 "$LANE_COUNT"); do
            run_lane "$lane" &
          done
          wait

          .github/scripts/memory-pressure.sh report

          tested=0
          for package in "${packages[@]}"; do
            if [ -e "$claims/$package/passed" ]; then
              tested=$((tested + 1))
            fi
          done
          failed=0
          if [ -s "$failures" ]; then
            failed=$(( $(wc -l < "$failures") ))
            echo "::error::Failing packages: $(tr '\n' ' ' < "$failures")"
          fi

          # A lane that dies after claiming a package leaves no pass and no fail
          # record, and the other lane skips it because the claim is there.
          # Counting both outcomes catches that; an absent failure does not.
          if [ "$((tested + failed))" -ne "${#packages[@]}" ]; then
            echo "::error::${#packages[@]} packages found, but $tested passed and $failed failed. A lane stopped early."
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "Tested $tested package(s) in $LANE_COUNT lane(s)"

  # Snapshot tests are the only tests that must run on iOS: they are the only
  # ones behind `#if os(iOS)`, so the macOS job above cannot see them. Every
  # other test compiles and runs there, and the app build jobs compile the
  # iOS-only sources, so nothing is covered twice and nothing is left out.
  #
  # A package opts in by declaring a test target whose name ends in
  # SnapshotTests, plus a shared scheme of the same name holding only that
  # target. That scheme keeps the build small when one target runs.
  #
  # When two or more targets run, the job uses the SnapshotTests scheme in the
  # app project, which holds every snapshot target, and names the ones to run
  # with `-only-testing:`. One call compiles more, and pays the package
  # resolution, the build planning and the simulator launch once rather than
  # once per target. A Linux lint check keeps that scheme in step with the
  # targets, because a target the scheme omits would never run on iOS.
  test-snapshots-ios:
    name: Test Snapshots (iOS Simulator)
    runs-on: macos-26
    env:
      DESTINATION: 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5'
      # Empty on a push, which is how the step below knows to run everything.
      BASE_REF: ${{ github.base_ref }}
    steps:
      - name: Checkout iOS Repository
        uses: actions/checkout@v4
        with:
          # The whole history, so a pull request can be compared with its base.
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      # The runner carries three iOS runtimes, each with its own iPhone 17 Pro.
      # Without OS= xcodebuild picks one and never says which, so an image roll
      # could change the runtime silently, which would break every reference
      # image at once. Checking here turns a missing runtime into one legible
      # line instead of a confusing xcodebuild error.
      - name: Check the pinned simulator runtime is present
        run: |
          set -euo pipefail
          xcrun simctl list runtimes | grep 'iOS 26.5'

      - name: Run the snapshot tests on the simulator
        run: |
          set -uo pipefail
          # A pull request runs only the snapshot targets its diff can change:
          # a package's own files, or those of a local package it depends on,
          # directly or not. A change to CI or to the app project runs them all.
          # A push to main always runs them all, which catches anything a pull
          # request skipped.
          changed=""
          run_all=true
          # --no-renames lists both paths of a moved file, so a file moved into
          # a package still counts as a change where it came from.
          if [ -n "$BASE_REF" ] && changed=$(git diff --name-only --no-renames "origin/$BASE_REF...HEAD"); then
            run_all=false
            if grep -qE '^(\.github/|SwiftLeeds\.xcodeproj/)' <<< "$changed"; then
              run_all=true
            fi
          fi
          # Prints the repository paths of a package and of every local package
          # it depends on, directly or not.
          local_package_paths() {
            (cd "$1" && swift package show-dependencies --format json) \
              | jq -r '.. | objects | select(has("path")) | .path' \
              | grep -v -e '/\.build/' -e '/SourcePackages/' \
              | sed "s|^$(pwd -P)/||"
          }
          # When the dependencies cannot be listed, or the list does not name
          # the package itself, the package counts as affected. So a failure
          # here runs a test rather than skipping one.
          is_affected() {
            $run_all && return 0
            paths=$(local_package_paths "$1") || return 0
            grep -qx "$1" <<< "$paths" || return 0
            for path in $paths; do
              grep -q "^$path/" <<< "$changed" && return 0
            done
            return 1
          }
          # The scheme names every snapshot target and the package that holds
          # it, and the lint job fails when the scheme and the manifests name
          # different targets. Reading it here replaces a `swift package
          # describe` per package, which cost 26s. The script fails when the
          # scheme runs no target, so an empty list cannot pass as "nothing to
          # do".
          listing=$(python3 .github/scripts/list-snapshot-targets.py) || exit 1
          selected=""
          skipped=""
          # The list arrives on file descriptor 3, not on stdin. `is_affected`
          # runs `swift package show-dependencies`, and a command that reads
          # stdin would otherwise swallow the targets this loop has not read
          # yet. Those targets would then be neither run nor reported, and the
          # job would pass. Measured with a stdin-reading command in the body:
          # one line of four survived.
          while read -r target package <&3; do
            if is_affected "$package"; then
              selected="$selected $target"
            else
              skipped="$skipped $(basename "$package")"
            fi
          done 3<<< "$listing"
          if [ -n "$skipped" ]; then
            echo "Skipped, because this pull request cannot affect them:$skipped"
          fi
          if [ -z "$selected" ]; then
            echo "No snapshot target can be affected by this pull request"
            exit 0
          fi
          # The call runs through SwiftLeeds.xcodeproj, never from a package's
          # own folder: from there each package is its own workspace, and Xcode
          # rebuilds the dependencies they share for every one.
          # Unquoted on purpose: the target names are one word each, and this
          # is how the step counts them.
          set -- $selected
          count=$#
          if [ "$count" -eq 1 ]; then
            # A package's own scheme holds only its own target, so this builds
            # one test target. The aggregate scheme below builds all of them.
            args=(-scheme "$1")
          else
            # One call pays the package resolution and the build planning once
            # instead of once per target. Measured on CI 2026-09-22: the step
            # went from 554s to 473s.
            # -only-testing: picks which targets run. It does not make the
            # build smaller: the scheme's targets all compile either way.
            args=(-scheme SnapshotTests)
            for target in $selected; do
              args+=(-only-testing:"$target")
            done
            # Bundles run on cloned simulators side by side, because installing
            # and launching a bundle costs far more than its tests: the step
            # went from 473s to 303s.
            # 3 workers were tried and not taken. They won 4 of 5 paired runs,
            # median 264s against 301s, but the 2-worker arm alone spanned 217s
            # to 359s. Separating a gap that small needs about 60 runs per arm.
            # Neither arm swapped.
            args+=(-parallel-testing-enabled YES -maximum-parallel-testing-workers 2)
          fi
          echo "::group::Snapshot tests:$selected"
          status=0
          # This call compiles and then tests, so the figure covers both. The
          # worker count only changes the test half, and both arms of a
          # comparison compile the same thing, so a difference between them
          # comes from the workers.
          .github/scripts/memory-pressure.sh start
          xcodebuild test -project SwiftLeeds.xcodeproj "${args[@]}" \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/snapshot-derived-data" \
            -skipPackagePluginValidation \
            || status=$?
          echo "::endgroup::"
          .github/scripts/memory-pressure.sh report
          if [ "$status" -ne 0 ]; then
            # One call covers several targets, and its status does not say
            # which one failed. Naming them all here would name six that
            # passed, so the group above is where a reader looks.
            echo "::error::The snapshot tests failed. The failing target is named in the log above"
            exit "$status"
          fi
          echo "Tested $count snapshot target(s) on the simulator:$selected"

  # The app build jobs compile the App Clip for both brands, but a trap at
  # launch compiles cleanly. This installs and launches it, and fails if the
  # process is gone a few seconds later. The script runs locally too.
  launch-app-clip:
    name: Launch ${{ matrix.brand }} App Clip (iOS Simulator)
    runs-on: macos-26
    # One runner per brand. The two builds share nothing, so running them side
    # by side halves the wait and gives each brand its own time limit.
    strategy:
      # Without this, one brand failing cancels the other, and a run reports
      # only the first failure.
      fail-fast: false
      matrix:
        include:
          - brand: SwiftLeeds
            configuration: Debug
            bundle-id: uk.co.swiftleeds.SwiftLeeds.Clip
          - brand: KotlinLeeds
            configuration: Debug-KotlinLeeds
            bundle-id: uk.co.kotlinleeds.KotlinLeeds.Clip
    # A simulator that never finishes booting would otherwise hold the runner
    # for the six-hour default. The job took 4m18s and 5m14s once the build and
    # the boot stopped overlapping, one run each. Keep this wide anyway: 10
    # minutes flaked before the split, and runner times vary by about half.
    timeout-minutes: 30
    env:
      # Empty on a push, which is how the scope step knows to run everything.
      BASE_REF: ${{ github.base_ref }}
    steps:
      - name: Checkout iOS Repository
        uses: actions/checkout@v4
        with:
          # The whole history, so a pull request can be compared with its base.
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      # A pull request skips the launch only when every file it changes sits
      # in a local package the App Clip does not depend on. Any change outside
      # Packages/ runs it: the App Clip compiles and bundles files from the
      # app's own folders, and a hand-kept list of them would go stale. The
      # App Clip reaches packages through ScheduleUI and NetworkKit; it can
      # reach another only through a project change, which is outside Packages/.
      - name: Decide whether this pull request can affect the App Clip
        id: scope
        run: |
          set -uo pipefail
          affected=true
          # --no-renames lists both paths of a moved file, so a file moved into
          # Packages/ still counts as a change where it came from.
          if [ -n "$BASE_REF" ] && changed=$(git diff --name-only --no-renames "origin/$BASE_REF...HEAD"); then
            if ! grep -qv '^Packages/' <<< "$changed"; then
              affected=false
              for root in Packages/ScheduleUI Packages/NetworkKit; do
                # When the dependencies cannot be listed, or the list does not
                # name the root itself, count the App Clip as affected. A
                # failure here must run the launch, never skip it.
                paths=$( (cd "$root" && swift package show-dependencies --format json) \
                  | jq -r '.. | objects | select(has("path")) | .path' \
                  | grep -v -e '/\.build/' -e '/SourcePackages/' \
                  | sed "s|^$(pwd -P)/||" ) || { affected=true; break; }
                grep -qx "$root" <<< "$paths" || { affected=true; break; }
                for path in $paths; do
                  if grep -q "^$path/" <<< "$changed"; then
                    affected=true
                    break 2
                  fi
                done
              done
            fi
          fi
          echo "affected=$affected" >> "$GITHUB_OUTPUT"
          if [ "$affected" = false ]; then
            echo "Skipped, because this pull request cannot affect the App Clip"
          fi

      - name: Launch the ${{ matrix.brand }} App Clip
        if: steps.scope.outputs.affected == 'true'
        run: .github/scripts/launch-app-clip.sh "${{ matrix.configuration }}" "${{ matrix.bundle-id }}" "$RUNNER_TEMP/app-clip-derived-data"

  lint-swift:
    name: Lint Swift Sources
    runs-on: macos-26
    env:
      # The version itself lives in .swiftlint-version, which the pre-commit
      # hook reads too, so both halves judge code by the same rules. Bumping it
      # means updating this checksum as well, or the download check below fails.
      SWIFTLINT_SHA256: 'c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0'
    steps:
      - name: Checkout iOS Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Install SwiftLint
        run: |
          set -euo pipefail
          version=$(cat .swiftlint-version)
          cd "$RUNNER_TEMP"
          curl -sSL --retry 3 -o portable_swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${version}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  portable_swiftlint.zip" | shasum -a 256 -c -
          unzip -q portable_swiftlint.zip -d swiftlint
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Lint every Swift source
        run: |
          # --strict is what makes this a gate: SwiftLint exits 0 on a warning,
          # so without it the job passes while reporting violations.
          status=0
          swiftlint lint --strict --reporter github-actions-logging \
            > "$RUNNER_TEMP/lint.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/lint.log"
          # A misspelt rule name is only a warning and leaves the exit code at 0,
          # which would silently disable that rule for everyone.
          if grep -q "is not a valid rule identifier" "$RUNNER_TEMP/lint.log"; then
            echo "::error::.swiftlint.yml names a rule SwiftLint does not recognise"
            exit 1
          fi
          exit "$status"

      # The simulator job finds snapshot tests by target name. A snapshot test
      # written into any other target would compile, pass on macOS by doing
      # nothing, and never run on iOS again. This turns that into a failure.
      - name: Check snapshot tests live in a snapshot target
        run: |
          set -uo pipefail
          stray=$(grep -rl "assertSnapshots(" Packages/*/Tests \
            | grep -v "/Tests/[^/]*SnapshotTests/" || true)
          if [ -n "$stray" ]; then
            echo "::error::These call assertSnapshots but sit outside a *SnapshotTests target:"
            echo "$stray"
            exit 1
          fi
          echo "Every assertSnapshots call is in a snapshot target"

  # An Xcode project file is a property list, so a repeated object id is
  # undefined. The parser keeps one definition and drops the other without a
  # word. That is how the app target once lost a package product link and went
  # on building anyway, because a second product pulled the module in behind it.
  #
  # This reads a text file. It needs no Xcode, no simulator and no compiler, so
  # it runs on Linux: a macOS runner bills ten times the rate for the same two
  # seconds of work. The image is pinned for the same reason the macOS jobs pin
  # theirs, so an image roll cannot break every branch with no commit to blame.
  lint-project-files:
    name: Lint Xcode Project Files
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout iOS Repository
        uses: actions/checkout@v4

      - name: Check every object id is defined once
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          # An object definition sits at exactly two tabs. Everything inside one
          # sits deeper, so this matches definitions and nothing else. Checked
          # against the parser: on a clean file the count of matches equals the
          # count of keys plutil reports.
          definition = re.compile(r"^\t\t([0-9A-F]{24})[ =]")

          files = sorted(Path().glob("*.xcodeproj/project.pbxproj"))
          files += sorted(Path().glob("Packages/*/*.xcodeproj/project.pbxproj"))
          if not files:
              print("::error::Found no project.pbxproj to check")
              sys.exit(1)

          failed = False
          for path in files:
              counts = {}
              for line in path.read_text().splitlines():
                  match = definition.match(line)
                  if match:
                      counts[match.group(1)] = counts.get(match.group(1), 0) + 1

              # Zero matches means the format moved, not that the file is clean.
              if not counts:
                  print(f"::error::{path} yielded no object ids, so this check is broken")
                  failed = True
                  continue

              repeated = sorted(i for i, n in counts.items() if n > 1)
              if repeated:
                  print(f"::error::{path} defines these object ids more than once: {', '.join(repeated)}")
                  failed = True
                  continue

              print(f"{path}: {len(counts)} object ids, each defined once")

          sys.exit(1 if failed else 0)
          PY

      # Reading the wrong app group fails silently: UserDefaults(suiteName:)
      # returns nil for a suite the target is not entitled to. The check reads
      # text only, so it stays on this runner, and it lives in a file so it can
      # be run locally: python3 .github/scripts/check-app-groups.py
      - name: Check every configuration writes to the app group it is granted
        run: python3 .github/scripts/check-app-groups.py

      # The simulator job runs one xcodebuild call against the SnapshotTests
      # scheme, so a target that scheme does not name never runs on iOS. It
      # would still compile on macOS and do nothing there, which is the gap
      # this closes.
      - name: Check the snapshot scheme lists every snapshot target
        run: python3 .github/scripts/check-snapshot-scheme.py

name: iOS CI Build Workflow

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-swiftleeds:
    name: Build SwiftLeeds (DEBUG)
    runs-on: macos-26
    steps:
      - name: Checkout iOS Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Build SwiftLeeds via Fastlane
        run: fastlane build_swiftleeds

  build-kotlinleeds:
    name: Build KotlinLeeds (DEBUG)
    runs-on: macos-26
    steps:
      - name: Checkout iOS Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Build KotlinLeeds via Fastlane
        run: fastlane build_kotlinleeds

  test-packages:
    name: Test Swift Packages
    runs-on: macos-26
    steps:
      - name: Checkout iOS Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Run every package test suite
        run: |
          set -uo pipefail
          scratch="$PWD/.build-shared"
          count=0
          failed=()
          for dir in Packages/*/; do
            [ -f "${dir}Package.swift" ] || continue
            echo "::group::${dir%/}"
            (cd "$dir" && swift test --scratch-path "$scratch") || failed+=("${dir%/}")
            echo "::endgroup::"
            count=$((count + 1))
          done
          if [ "$count" -eq 0 ]; then
            echo "No Swift packages found under Packages/" >&2
            exit 1
          fi
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Failing packages: ${failed[*]}"
            exit 1
          fi
          echo "Tested $count package(s)"

  # The macOS job above skips everything behind `#if os(iOS)` or
  # `#if canImport(UIKit)`, snapshot tests included. This one runs the same
  # packages where those branches exist.
  test-packages-ios:
    name: Test Swift Packages (iOS Simulator)
    runs-on: macos-26
    env:
      # A SwiftPM test bundle runs inside Xcode's `xctest` agent, which carries
      # only `get-task-allow`. With no `application-identifier` the keychain
      # cannot pick an access group, so every SecItem call returns -34018. Drop
      # this once those tests have a host app.
      UNRUNNABLE: SecureStorageKitKeychainTests
      DESTINATION: 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5'
    steps:
      - name: Checkout iOS Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      # The runner carries three iOS runtimes, each with its own iPhone 17 Pro.
      # Without OS= xcodebuild picks one and never says which, so an image roll
      # could change the runtime silently, which would break every reference
      # image at once. Checking here turns a missing runtime into one legible
      # line instead of a confusing xcodebuild error.
      - name: Check the pinned simulator runtime is present
        run: |
          set -euo pipefail
          xcrun simctl list runtimes | grep 'iOS 26.5'

      - name: Run every package test suite on the simulator
        run: |
          set -uo pipefail
          count=0
          failed=""
          for dir in Packages/*/; do
            [ -f "${dir}Package.swift" ] || continue
            name=$(basename "$dir")
            targets=$( (cd "$dir" && swift package describe --type json) \
              | jq -r --arg skip "$UNRUNNABLE" \
                '[.targets[] | select(.type == "test") | .name] - ($skip | split(" ")) | .[]' )
            if [ -z "$targets" ]; then
              echo "::notice::$name has no test target that can run on the simulator"
              continue
            fi
            only=()
            for target in $targets; do only+=("-only-testing:$target"); done
            # A package with more than one library product gets an aggregate
            # "-Package" scheme; a single-product package's scheme carries the
            # package's own name.
            scheme="$name"
            if (cd "$dir" && xcodebuild -list -json 2>/dev/null) | grep -q "\"$name-Package\""; then
              scheme="$name-Package"
            fi
            echo "::group::$name ($scheme)"
            (cd "$dir" && xcodebuild test -scheme "$scheme" -destination "$DESTINATION" "${only[@]}") \
              || failed="$failed $name"
            echo "::endgroup::"
            count=$((count + 1))
          done
          if [ -n "$failed" ]; then
            echo "::error::Failing packages:$failed"
            exit 1
          fi
          echo "Tested $count package(s) on the simulator"

  lint-swift:
    name: Lint Swift Sources
    runs-on: macos-26
    env:
      # The version itself lives in .swiftlint-version, which the pre-commit
      # hook reads too, so both halves judge code by the same rules. Bumping it
      # means updating this checksum as well, or the download check below fails.
      SWIFTLINT_SHA256: 'c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0'
    steps:
      - name: Checkout iOS Repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Install SwiftLint
        run: |
          set -euo pipefail
          version=$(cat .swiftlint-version)
          cd "$RUNNER_TEMP"
          curl -sSL --retry 3 -o portable_swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${version}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  portable_swiftlint.zip" | shasum -a 256 -c -
          unzip -q portable_swiftlint.zip -d swiftlint
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: Lint every Swift source
        run: |
          # --strict is what makes this a gate: SwiftLint exits 0 on a warning,
          # so without it the job passes while reporting violations.
          status=0
          swiftlint lint --strict --reporter github-actions-logging \
            > "$RUNNER_TEMP/lint.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/lint.log"
          # A misspelt rule name is only a warning and leaves the exit code at 0,
          # which would silently disable that rule for everyone.
          if grep -q "is not a valid rule identifier" "$RUNNER_TEMP/lint.log"; then
            echo "::error::.swiftlint.yml names a rule SwiftLint does not recognise"
            exit 1
          fi
          exit "$status"

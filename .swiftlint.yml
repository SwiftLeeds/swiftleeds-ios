# Three kinds of entry, and the difference matters when one is questioned.
#
# The first group traces to a convention recorded in the project's Swift rules,
# quoted above each entry. Where a SwiftLint default contradicts one of those
# conventions, the default is changed here and the reason is stated.
#
# The second group, "rules nothing here breaks", defends a standard the project
# does not dispute but has never written down. Each one found zero violations
# when it was added, so it costs no fixes and only holds new code. A rule that
# would need a sweep does not belong there: it needs a decision first.
#
# The third group, "rules that needed a sweep", holds rules that were decided
# on and then fixed at every site, suppressed inline, with the reason, at a
# site left as it is, or narrowed by an option in its section below. One rule,
# `no_magic_numbers`, also left sites in the baseline; its comment says which.
# For most rules the config line and the fixes land in one commit, so
# `git log -S<rule>` shows what each rule changed. The fixes for
# `no_magic_numbers` came in the commits just before it. So did two for
# `explicit_enum_raw_value`, which removed the raw types of `LogLevel` and
# `TabItems`. So did the moves for `one_declaration_per_file`.
#
# Tuned against the SwiftLint version in .swiftlint-version, which CI installs
# and the pre-commit hook checks against. Rule defaults change between versions,
# so re-run the suite after a bump.

# The violations left after the mechanical fixes, 12 as of 2026-10-25, down from
# 78, plus 197 view layout numbers `no_magic_numbers` found. It found 206, and
# nine left the baseline when their previews became `#Preview`. They stay
# recorded rather than fixed, so linting starts green and new code is held to
# the full rule set. Read the current list with
# `swiftlint baseline report .swiftlint.baseline --reporter summary`.
# SwiftLint matches a baselined violation by its content, not its line number,
# so unrelated edits above it do not resurface it. Burn this down over time.
baseline: .swiftlint.baseline

# CI and the pre-commit hook name their files on the command line, which
# overrides this list. It decides only what a bare `swiftlint lint` reads.
included:
  - Packages/*/*/Package.swift
  - Packages/*/*/Sources
  - Packages/*/*/Tests
  - SwiftLeeds
  - SwiftLeedsAppClip
  - SwiftLeedsPackage
  - SwiftLeedsWidget

# Each package resolves its dependencies into its own .build directory, so the
# glob must reach a nested one. A plain ".build" entry matches the root only,
# which leaves several hundred third-party files getting linted.
excluded:
  - "**/.build"
  - .build-shared
  - DerivedData

opt_in_rules:
  # "Never write `!`. No force unwrap, no `as!`, no `try!`, in source or in tests."
  - force_unwrapping
  - implicitly_unwrapped_optional
  # "Held as `@State private var viewModel = ViewModel()`."
  - private_swiftui_state
  # "Minimise access. Escalate one level at a time, only when something that
  # exists today requires it."
  - lower_acl_than_parent
  # "Model absence away rather than unwrapping: a throwing initialiser, a typed
  # error, a default." An optional Bool has three states where the domain has
  # two, and an optional collection says nothing an empty one does not.
  - discouraged_optional_boolean
  - discouraged_optional_collection
  # "Omit `return` where Swift allows it."
  - implicit_return
  # "A `Task` handles what it throws."
  - unhandled_throwing_task

  # Rules nothing here breaks. Each found zero violations when it was added, so
  # none of them changed a line of source.

  # "Favour functional style. Treat `Optional` and `Result` as functors: `map`,
  # `flatMap`, `compactMap`." These name the call that says what you mean.
  - array_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - first_where
  - flatmap_over_map_reduce
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - sorted_first_last

  # "Code reads like clean English." Each of these deletes a word that carries
  # no meaning.
  - direct_return
  - empty_collection_literal
  - empty_string
  - explicit_init
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - redundant_final
  - redundant_nil_coalescing
  - redundant_type_annotation
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

  # A reference that outlives what it points at, or an observer nobody removes,
  # is a leak the compiler cannot see.
  - discarded_notification_center_observer
  - unowned_variable_capture
  - weak_delegate

  # "Prefer typed throws." An error, a crash and a fallthrough each need to be
  # deliberate and visible at the point a reader meets them.
  - fallthrough
  - fatal_error_message
  - return_value_from_void_function
  - unavailable_function
  - untyped_error_in_catch
  - yoda_condition

  # Layout the codebase already follows everywhere.
  - closure_spacing
  - collection_alignment
  - comma_inheritance
  - file_name_no_space
  - literal_expression_end_indentation
  - modifier_order
  - multiline_parameters
  - multiline_parameters_brackets
  - period_spacing
  - vertical_parameter_alignment_on_call

  # "One enum case per line" and "a domain type does not conform to `Codable`":
  # these guard the shapes those rules leave behind.
  - convenience_type
  - local_doc_comment
  - optional_enum_case_matching
  - pattern_matching_keywords
  - raw_value_for_camel_cased_codable_enum
  - static_operator

  # Rules that needed a sweep. Each had 1 to 26 violations when it was turned
  # on, from 2026-10-15. The exceptions, all on 2026-10-23:
  # `no_magic_numbers` had 327, `prefer_self_in_static_references` had 106,
  # `vertical_whitespace_between_cases` had 141 and `explicit_enum_raw_value`
  # had 41.

  # "Code reads like clean English." Each of these takes the shorter form Swift
  # offers: a comma for `&&`, `if let x` for `if let x = x`, a return after the
  # `if` for an `else`, `self` for a second name bound to it, and no `self.` in
  # a closure where Swift lets you leave it out.
  - prefer_condition_list
  - shorthand_optional_binding
  - superfluous_else
  - self_binding
  - redundant_self

  # A number of four or more digits takes `_` between groups, so `3_200` is
  # read at a glance and `1000` is never mistaken for `10000`.
  - number_separator

  # `reduce(into:)` mutates one accumulator in place, where `reduce` builds a
  # new String or Array on every step and throws the previous one away.
  - reduce_into

  # `isEmpty` names the question, and on a collection that is not random access
  # `count` walks every element to answer it.
  - empty_count

  # An `async` function with no `await` never suspends, yet every caller must
  # still `await` it. Its one hit is suppressed inline, with the reason.
  - async_without_await

  # A closure the body only calls directly needs no `@escaping`. Leaving it off
  # tells the caller the closure cannot run after the function returns.
  - unneeded_escaping

  # `onTapGesture` alone does not mark a view as a button, so VoiceOver, Switch
  # Control and Voice Control do not offer it as one. Use a `Button`.
  - accessibility_trait_for_button

  # An enum case or static member named `none` reads as `Optional.none`, so a
  # reader of `x ?? .none` cannot tell which is meant. Name it for what it is.
  - discouraged_none_name

  # The formatter neither adds nor removes a blank line around a `let` or
  # `var`, so this rule can own it without the two tools disagreeing.
  - let_var_whitespace

  # "Favour functional style." A closure that only reads a property is
  # written as the key path to it: `map(\.name)`, not `map { $0.name }`.
  - prefer_key_path

  # A function or closure marked `throws` or `rethrows` that cannot throw tells
  # a reader it can fail. Every hit when it was turned on was in a test.
  - unneeded_throws_rethrows

  # Two sides of a comparison written the same way usually means one side was
  # copied and not changed. Every hit when it was turned on was a test
  # comparing two values built the same way.
  - identical_operands

  # A long closure, in practice always a view builder here, hides its
  # structure. Split it into named views. The limit is set below.
  - closure_body_length

  # "One type per file, named after the type." A file of extensions is named
  # `Type+Topic.swift`, as `Log+Transform.swift` is. The exceptions are below.
  - file_name

  # An image that carries meaning gets a label; a decorative one, or one that
  # repeats the text beside it, is hidden from VoiceOver. The rule cannot see
  # a parent in another view or a custom builder, so those images are hidden.
  - accessibility_label_for_image

  # "No magic numbers or magic values. Name a literal for its meaning wherever
  # the meaning is not obvious at the call site. Test fixtures and benchmark
  # operands are data, not magic." Fixture data is suppressed inline. A block of
  # numbers a token set or a spec defines, such as the `Spacing` values or the
  # HTTP status codes and classes, is suppressed between a disable and an
  # enable. The layout numbers in views, 206 when the
  # rule was turned on and 197 now, are in the baseline until design tokens
  # replace them.
  - no_magic_numbers

  # In a type or its extension, `Self` names the type without repeating it:
  # `Self(...)`, `-> Self`.
  - prefer_self_in_static_references

  # A blank line before each switch case makes each case read as its own block.
  # The formatter neither adds nor removes these lines, so the two tools agree.
  - vertical_whitespace_between_cases

  # A raw value written out stays the same when a case is renamed. Every value
  # written out was a JSON key, a saved setting or a value the backend sends.
  - explicit_enum_raw_value

  # A reader meets the file's subject first.
  - file_types_order

  # "One type per file, named after the type." A helper type nests inside the
  # type it serves, and a test double inside its suite. AuthenticationUI's design
  # system is a frozen copy, suppressed inline until UIDesign replaces it.
  - one_declaration_per_file

  # An empty statement, function or accessor body says nothing about whether
  # it is meant. Where one is meant, a comment inside the braces says why.
  - no_empty_block

  # A reader meets what a type is before what it does: cases and nested types,
  # then properties and initializers, then deinit, then methods.
  - type_contents_order

# Analyzer rules read the compiler log, so they run only through
# `swiftlint analyze`, never `swiftlint lint`.
analyzer_rules:
  # An import the file does not use, or one it uses only through another module.
  - unused_import
  # A captured variable that changes after the closure is made.
  - capture_variable

unused_import:
  # Every module a file uses is imported by name, so a file never relies on
  # another import to bring one in.
  require_explicit_imports: true
  # Each entry names a module and the modules it brings in on its own. A file may
  # use those without importing them, because nobody writes `import Darwin` to
  # call a Foundation API.
  allowed_transitive_imports:
    - module: Foundation
      allowed_transitive_imports:
        - CoreFoundation
        - ObjectiveC
        - Darwin
    - module: SwiftUI
      allowed_transitive_imports:
        - CoreFoundation
        - CoreGraphics
        - DeveloperToolsSupport
    - module: CoreGraphics
      allowed_transitive_imports:
        - CoreFoundation
    - module: CoreImage
      allowed_transitive_imports:
        - CoreFoundation
        - CoreGraphics
    # CoreLocation re-exports the private module that holds `CLLocationCoordinate2D`.
    - module: CoreLocation
      allowed_transitive_imports:
        - _LocationEssentials
    # `swift-dependencies` re-exports these two with `@_exported`.
    - module: Dependencies
      allowed_transitive_imports:
        - IssueReporting
        - ConcurrencyExtras

disabled_rules:
  # `swift format` owns layout. A SwiftLint rule about where a character goes is
  # off when the formatter contradicts it or duplicates it. A rule the formatter
  # has no opinion on, such as `let_var_whitespace`, can be on. Several below
  # are opt-in rules that were never enabled; they are listed so nobody turns
  # them on and re-derives why they do not work here.
  #
  # Contradictions. The formatter writes what the rule forbids, so fixing the
  # violations by hand would be undone by the next format run.
  #
  # `trailing_comma`: the formatter puts a comma on every multi-line list of two
  # or more elements, collections and argument lists alike, and removes it from
  # a list of one.
  # `sorted_imports`: `OrderedImports` sorts by code point, where a capital
  # letter precedes every lowercase one, and this rule ignores case. No ordering
  # satisfies both, so any module named lowercase, such as `os`, splits them.
  # `opening_brace`: the formatter puts `{` on its own line after a wrapped
  # multi-line condition.
  # `extension_access_modifier`: it wants the access level hoisted onto the
  # extension declaration, and the formatter moves it onto each member instead.
  # `multiline_arguments`, `multiline_arguments_brackets` and
  # `multiline_call_arguments`: each wants one argument per line, and
  # `.swift-format` keeps the formatter's fill wrapping.
  # `multiline_function_chains`: when a chain is too long, the formatter wraps
  # one call's arguments, so the chain carries on after the closing bracket.
  - trailing_comma
  - sorted_imports
  - opening_brace
  - extension_access_modifier
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_call_arguments
  - multiline_function_chains
  #
  # Duplicates. The formatter already enforces these, and its own check gates
  # every pull request, so a second gate on the same lines adds nothing.
  #
  # `indentation_width`: the pretty-printer owns indentation. This rule also
  # reads indentation inside `"""` literals, which here is JSON fixture data.
  # `no_extension_access_modifier`: the formatter's
  # `NoAccessLevelOnExtensionDeclaration` is on and does the same thing.
  # `vertical_whitespace_opening_braces` and
  # `vertical_whitespace_closing_braces`: the formatter's
  # `NoEmptyLinesOpeningClosingBraces` removes a blank line after `{` and before
  # `}`. These rules also check `(` and `[`, which nothing else checks. That is
  # a choice: no kind of line has two owners.
  - indentation_width
  - no_extension_access_modifier
  - vertical_whitespace_opening_braces
  - vertical_whitespace_closing_braces
  #
  # Not layout. Documentation is a house rule that review checks, at every
  # access level. `missing_docs` cannot check it. By default it checks only
  # `open` and `public` declarations, and it skips any type whose declaration
  # names a protocol, superclass or raw type, with all of that type's members.
  # With every access level listed and `excludes_inherited_types: false`, it
  # flags every protocol witness, such as `body`. The house rule exempts a
  # witness that adds nothing, which the rule would flag.
  - missing_docs
  #
  # Contradicts another SwiftLint rule. `redundant_string_enum_value` flags
  # `case name = "name"`, which `explicit_enum_raw_value` asks for.
  - redundant_string_enum_value

# `.swift-format` sets `lineLength` to this number. Pin it here rather than
# inheriting SwiftLint's default, so a version bump cannot move one tool's limit
# without the other. `--strict` is what makes the warning threshold a gate.
line_length: 120

# "Stop short of point-free cleverness." An identity closure such as
# `compactMap { $0 }` stays a closure; `\.self` would be the clever form.
prefer_key_path:
  ignore_identity_closures: true

# The default of 30 lines flagged 19 closures in 11 files, all view builders.
# At 60, the three over the limit were split into named view properties.
# `--strict` makes the warning a gate, so no error level is set.
closure_body_length:
  warning: 60

# A no-op closure (`retry: {}`, `Log { _ in }`) and an empty `init()` that
# only widens a type's access are idioms: 90 of the 92 blocks the rule found.
# The other two are required `stopLoading()` overrides in test stubs.
no_empty_block:
  disabled_block_types:
    - closure_blocks
    - initializer_bodies

# The house order: nested types and cases first, then properties and
# initializers, then deinit, then methods. SwiftLint's default order wants
# every property above `init`, which puts a view's `body` above its
# initializer, and enum cases above nested types.
type_contents_order:
  order:
    - [case, type_alias, associated_type, subtype]
    - [type_property, instance_property, initializer, ib_inspectable, ib_outlet]
    - [deinitializer]
    - [type_method, view_life_cycle_method, ib_action, ib_segue_action, other_method, subscript]

# Setting `excluded` replaces the default list, `LinuxMain.swift` and
# `main.swift`; neither exists here.
# - `LogCategories.swift` holds each module's `extension LogCategory`, and
#   the name is the one every module uses.
# - `RequiredSwiftFileForSPM.swift` gives a resource-only target a Swift
#   source. Its name says that role, not the placeholder view inside it.
# - Each `Assert...Snapshots.swift` test helper is named for the assertion it
#   adds, not for a type.
# - ScheduleUI's `ScheduleFixtures.swift` holds fixtures for five types, from
#   `Speaker` to `Schedule.Slot`, so no one type names it.
file_name:
  excluded:
    - LogCategories.swift
    - RequiredSwiftFileForSPM.swift
  excluded_paths:
    - "/Tests/.*/Assert[A-Za-z]*Snapshots[.]swift$"
    - "/ScheduleUISnapshotTests/ScheduleFixtures[.]swift$"

# A view model nests under its view, and its own `Phase` and `Alert` enums nest
# under that. The default of one level rejects the house pattern.
nesting:
  type_level: 2

# The default puts helpers first. The rule does not see `#Preview`. With
# `one_declaration_per_file` on, a second top-level type appears only where that
# rule is suppressed.
file_types_order:
  order:
    - [main_type]
    - [supporting_type, extension]
    - [preview_provider]
    - [library_content_provider]

type_name:
  max_length:
    warning: 50

# "id" is SwiftLint's own default allowance. An `excluded` list replaces the
# default rather than adding to it, so dropping "id" here would start flagging
# every `Identifiable` conformance. "x" and "y" name pixel coordinates.
# "ok" is HTTP vocabulary: `HTTPStatus.ok` names the 200 status.
identifier_name:
  excluded:
    - id
    - x
    - y
    # HTTP spells these, and we do not get to rename them.
    - ok
    - te

# "Never compare a `Bool` with `== true` or `== false`. Write `x` or `!x`."
# SwiftLint has no built-in rule for this, so a regex holds it. Its fixes landed
# before it, one commit per package: `git log --grep "test a Bool directly"`.
custom_rules:
  bool_literal_comparison:
    name: "Bool Literal Comparison"
    regex: '(==|!=)\s*(true|false)\b|\b(true|false)\s*(==|!=)'
    excluded_match_kinds:
      - comment
      - comment.mark
      - comment.url
      - doccomment
      - doccomment.field
      - string
    message: "Test a Bool directly: write `x` or `!x`. On an optional chain, unwrap first: `if let text, !text.isEmpty`."
    severity: warning
